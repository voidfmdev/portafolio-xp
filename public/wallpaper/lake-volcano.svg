<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1D5BC4"/>
      <stop offset="0.6" stop-color="#6EA6E8"/>
      <stop offset="1" stop-color="#CFE5FA"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FA6E3"/>
      <stop offset="1" stop-color="#1E4C99"/>
    </linearGradient>
    <linearGradient id="slope" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#71839F"/>
      <stop offset="0.5" stop-color="#55667F"/>
      <stop offset="1" stop-color="#3B4860"/>
    </linearGradient>
    <radialGradient id="sun">
      <stop offset="0" stop-color="#FFFBE6"/>
      <stop offset="0.35" stop-color="#FFF4C2" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#FFF4C2" stop-opacity="0"/>
