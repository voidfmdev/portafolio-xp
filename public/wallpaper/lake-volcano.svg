    <path id="volcano" d="M560 600C760 520 900 380 985 232Q1020 220 1055 232C1140 380 1280 520 1480 600Z"/>
    <clipPath id="volcano-clip"><use href="#volcano"/></clipPath>
    <clipPath id="lake-clip"><rect y="600" width="1600" height="300"/></clipPath>
  </defs>

  <rect width="1600" height="600" fill="url(#sky)"/>
  <circle cx="1240" cy="150" r="120" fill="url(#sun)"/>

