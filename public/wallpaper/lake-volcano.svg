    <path d="M1030 228H1240V345L1112 346L1094 330L1074 356L1054 334L1040 352Z" fill="#D5E0EE"/>
  </g>

  <!-- Lake, far shore and reflection -->
  <rect y="600" width="1600" height="300" fill="url(#lake)"/>
